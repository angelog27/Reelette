
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <meta name="mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
      <meta name="format-detection" content="telephone=no" />
      <meta name="description" content="Reelette — Discover, track, and spin for your next movie or show. Browse trending titles, get personalized picks, and find what to watch on Netflix, Disney+, Hulu, and more." />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400;1,700;1,900&display=swap" />
      <link rel="icon" type="image/png" href="/favicon-32.png" />
      <title>Reelette</title>
      <!-- Apply saved theme before React mounts to prevent flash -->
      <script>
        (function () {
          var t = localStorage.getItem('reel-theme') || 'dark';
          document.documentElement.classList.add(t);
        })();
      </script>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
